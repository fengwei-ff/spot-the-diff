<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4a7a"/>
      <stop offset="1" stop-color="#8aa0c8"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4a36"/>
      <stop offset="1" stop-color="#2a1f12"/>
    </linearGradient>
  </defs>
  <!-- 天空 -->
  <rect width="720" height="380" fill="url(#sky)"/>
  <!-- 月亮 -->
  <circle cx="560" cy="90" r="38" fill="#f5e9b8"/>
  <!-- 远山 -->
  <polygon points="0,260 120,180 220,240 320,170 460,250 600,190 720,260 720,380 0,380" fill="#2a3050" opacity="0.85"/>
  <!-- 地面 -->
  <rect y="380" width="720" height="160" fill="url(#ground)"/>
  <!-- 屋檐 -->
  <polygon points="180,260 360,180 540,260 540,300 180,300" fill="#7a3b2e"/>
  <polygon points="180,260 360,180 540,260" fill="#5e2c22"/>
  <!-- 屋身 -->
  <rect x="220" y="300" width="280" height="120" fill="#c8a36a"/>
  <!-- 门 -->
  <rect x="330" y="330" width="60" height="90" fill="#3a2412"/>
  <circle cx="378" cy="378" r="3" fill="#ffd166"/>
  <!-- 灯笼 A：红色 -->
  <ellipse cx="240" cy="290" rx="14" ry="18" fill="#d63031"/>
  <rect x="237" y="270" width="6" height="6" fill="#222"/>
  <!-- 灯笼 B：红色 -->
  <ellipse cx="480" cy="290" rx="14" ry="18" fill="#d63031"/>
  <rect x="477" y="270" width="6" height="6" fill="#222"/>
  <!-- 树 -->
  <rect x="80" y="320" width="14" height="80" fill="#3a2412"/>
  <circle cx="87" cy="310" r="40" fill="#2f6b3a"/>
  <!-- 星星 -->
  <circle cx="120" cy="80" r="2" fill="#fff"/>
  <circle cx="200" cy="50" r="2" fill="#fff"/>
  <circle cx="320" cy="100" r="2" fill="#fff"/>
  <circle cx="640" cy="60" r="2" fill="#fff"/>
  <!-- 旗子 -->
  <rect x="600" y="280" width="3" height="40" fill="#222"/>
  <polygon points="603,280 630,290 603,300" fill="#ffd166"/>
  <!-- 石灯 -->
  <rect x="140" y="380" width="20" height="30" fill="#7a7a7a"/>
  <rect x="135" y="370" width="30" height="12" fill="#9a9a9a"/>
</svg>
